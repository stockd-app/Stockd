version: "3.8"

services:
  # Frontend - Nginx serving React
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: stockd-frontend
    ports:
      - "80:80"
    volumes:
      - ./Frontend/dist:/usr/share/nginx/html:ro
      - ./Frontend/nginx-docker.conf:/etc/nginx/conf.d/nginx-docker.conf:ro
    depends_on:
      - backend
    networks:
      - stockd-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: stockd-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
    depends_on:
      - food-classifier
      - recipe-recommender
    networks:
      - stockd-network
    restart: unless-stopped

  # AI Model 1 - Food Item Classifier
  food-classifier:
    build:
      context: ./AI
      dockerfile: Dockerfile.classifier
    container_name: stockd-food-classifier
    ports:
      - "9002:9002"
    volumes:
      - ./AI/Food_Classifier:/app/
    networks:
      - stockd-network
    restart: unless-stopped

  # AI Model 2 - Recipe Recommender
  recipe-recommender:
    build:
      context: ./AI
      dockerfile: Dockerfile.recipe
    container_name: stockd-recipe-recommender
    ports:
      - "9001:9001"
    volumes:
      - ./AI/Recipe_Recommender:/app/
    networks:
      - stockd-network
    restart: unless-stopped

networks:
  stockd-network:
    driver: bridge
    name: stockd-network
