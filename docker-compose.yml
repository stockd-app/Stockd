services:
  # Frontend - Nginx serving React
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: stockd-frontend
    ports:
      - "80:80"
    volumes:
      - ./Frontend/dist:/usr/share/nginx/html:ro
      - ./Frontend/nginx-docker.conf:/etc/nginx/conf.d/nginx-docker.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend - FastAPI
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: stockd-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      food-classifier:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - stockd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Model 1 - Food Classifier
  food-classifier:
    build:
      context: ./AI
      dockerfile: Dockerfile.classifier
    container_name: stockd-food-classifier
    ports:
      - "9002:9002"
    volumes:
      - ./AI/Food_Classifier:/app/
    networks:
      - stockd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 350s

  # AI Model 2 - Recipe Recommender
  recipe-recommender:
    build:
      context: ./AI
      dockerfile: Dockerfile.recommender
    container_name: stockd-recipe-recommender
    ports:
      - "9001:9001"
    environment:
      - ALLERGENS_CSV_PATH=/app/allergendataset.csv
    volumes:
      - ./AI/Recipe_Recommender:/app/
    networks:
      - stockd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database - MySQL
  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: stockd-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stockd_db
      MYSQL_USER: stockd_user
      MYSQL_PASSWORD: stockd_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d
    networks:
      - stockd-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpass",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Uptime Kuma - Monitoring Dashboard
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: stockd-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - stockd-network
    restart: unless-stopped

networks:
  stockd-network:
    driver: bridge
    name: stockd-network

volumes:
  mysql_data:
  uptime-kuma-data:
