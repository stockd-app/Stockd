version: "3.8"

services:
  # Frontend - Nginx serving React
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: stockd-frontend
    ports:
      - "80:80"
    volumes:
      - ./Frontend/dist:/usr/share/nginx/html:ro
      - ./Frontend/nginx-docker.conf:/etc/nginx/conf.d/nginx-docker.conf:ro
    depends_on:
      - backend
    networks:
      - stockd-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: stockd-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
    depends_on:
      - food-classifier
    networks:
      - stockd-network
    restart: unless-stopped

  # AI Model 1 - Item Classifier
  food-classifier:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: stockd-food-classifier
    ports:
      - "9002:9002"
    volumes:
      - ./AI/app:/app/app
    networks:
      - stockd-network
    restart: unless-stopped
    
  # Database - MySQL  
  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: stockd-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stockd_db
      MYSQL_USER: stockd_user
      MYSQL_PASSWORD: stockd_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d
    networks:
      - stockd-network
    restart: unless-stopped

networks:
  stockd-network:
    driver: bridge
    name: stockd-network

volumes:
  mysql_data: